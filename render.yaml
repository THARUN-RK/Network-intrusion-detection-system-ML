services:
  # Unified NIDS Web Service: Hosts both FastAPI Backend & Streamlit Dashboard on 1 Free Tier Instance
  - type: web
    name: nids-soc-dashboard
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "chmod +x start.sh && ./start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NIDS_API_URL
        value: http://127.0.0.1:8000
    plan: free
    autoDeploy: true
