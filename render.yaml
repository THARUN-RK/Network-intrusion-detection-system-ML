services:
  # NIDS SOC Production Web Service: FastAPI Engine & SOC Console
  - type: web
    name: nids-soc-api
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "chmod +x start.sh && ./start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
    plan: free
    autoDeploy: true
