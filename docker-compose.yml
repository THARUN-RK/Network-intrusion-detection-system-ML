version: '3.8'

services:
  # Optional Production PostgreSQL Database (Comment out to use default SQLite)
  nids-postgres:
    image: postgres:15-alpine
    container_name: nids_soc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nids_soc
      POSTGRES_USER: soc_admin
      POSTGRES_PASSWORD: SocSecretPassword2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # FastAPI REST & WebSocket Backend
  nids-backend:
    build: .
    container_name: nids_fastapi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://soc_admin:SocSecretPassword2026!@nids-postgres:5432/nids_soc
      - JWT_SECRET_KEY=nids-production-secret-key-2026
    depends_on:
      - nids-postgres

  # Streamlit SOC Frontend Dashboard
  nids-dashboard:
    build: .
    container_name: nids_streamlit_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    command: streamlit run frontend/dashboard.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - nids-backend
    environment:
      - NIDS_API_URL=http://nids-backend:8000
      - DATABASE_URL=postgresql://soc_admin:SocSecretPassword2026!@nids-postgres:5432/nids_soc

volumes:
  postgres_data:
